<style>
/* Layout: sticky toolbar, editor column on the left, live Word-style page on the right; tabs replace the split on phones. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface-2:#e8eef6; --ink:#142030; --muted:#566779; --line:#d2dce8;
  --accent:#1f5fae; --accent-ink:#ffffff; --accent-soft:#dbe8f8;
  --good:#1b7a4a; --good-soft:#dcf1e6; --warn:#9a5600; --crit:#b3261e;
  --paper:#ffffff; --paper-ink:#111111;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hdr:calc(3.5rem + env(safe-area-inset-top,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131a; --surface:#151d27; --surface-2:#1c2733; --ink:#e6edf5; --muted:#93a3b5; --line:#2a3846;
  --accent:#6aa6ee; --accent-ink:#08131f; --accent-soft:#1a2c44; --good:#55c48d; --good-soft:#143326; --warn:#e0a04a; --crit:#f08a82;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131a; --surface:#151d27; --surface-2:#1c2733; --ink:#e6edf5; --muted:#93a3b5; --line:#2a3846;
  --accent:#6aa6ee; --accent-ink:#08131f; --accent-soft:#1a2c44; --good:#55c48d; --good-soft:#143326; --warn:#e0a04a; --crit:#f08a82;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:var(--hdr)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:.5rem max(16px,env(safe-area-inset-right,0px)) .5rem max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;min-height:3.5rem}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.4rem .75rem;font-weight:600;font-size:.82rem;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:.2rem .5rem;font-size:.75rem}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:none;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:.75rem 0}
.tabs button{flex:1;border:0;background:var(--surface);padding:.55rem;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.25rem;align-items:start;margin-top:1rem}
#editor{display:flex;flex-direction:column;gap:1rem;min-width:0}
#previewWrap{position:sticky;top:var(--hdr);height:calc(100dvh - var(--hdr) - 1rem);overflow:auto;min-width:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;min-width:0}
.card h2{font-size:.78rem;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .75rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.step{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700}
.hint{color:var(--muted);font-size:.8rem;margin:.25rem 0 0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:.1rem .45rem;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{color:var(--warn)}
.drop{display:flex;align-items:center;justify-content:center;gap:.5rem;text-align:center;border:1.5px dashed var(--line);border-radius:8px;padding:.9rem .75rem;color:var(--muted);cursor:pointer;background:var(--bg);font-size:.85rem}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop.big{padding:1.1rem}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
label.f{display:flex;flex-direction:column;gap:.2rem;font-size:.75rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:.4rem .55rem;color:var(--ink);min-width:0}
textarea{resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.sec-h{display:flex;align-items:center;gap:.5rem;padding:.6rem .75rem;flex-wrap:wrap}
.badge{flex:none;width:1.7rem;height:1.7rem;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-family:var(--f-mono)}
.sec-h input{flex:1 1 10rem;font-weight:700;font-size:.95rem;background:transparent;border-color:transparent}
.sec-h input:hover{border-color:var(--line)}
.tools{display:flex;gap:.25rem;margin-left:auto}
.sec-b{padding:0 .75rem .85rem;display:flex;flex-direction:column;gap:.75rem}
.obj{border:1px solid var(--line);border-radius:8px;padding:.75rem;display:flex;flex-direction:column;gap:.6rem;background:var(--bg);min-width:0}
.obj-h{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.obj-h .n{flex:0 1 11rem;font-weight:700}
.obj-h .d{flex:1 1 12rem}
.dash{border:1px solid var(--line);border-radius:8px;padding:.65rem;display:flex;flex-direction:column;gap:.55rem;background:var(--surface);min-width:0}
.dash.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dash-h{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.dash-h input{flex:1 1 9rem;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.thumbs img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#000}
.thumbs .row{display:flex;gap:.25rem}
.thumbs input{font-size:.75rem;padding:.25rem .4rem}
.files{display:flex;flex-direction:column;gap:.35rem}
.file{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:6px;padding:.3rem .45rem;background:var(--bg);min-width:0}
.file img{width:1.6rem;height:2rem;flex:none}
.file .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:.8rem;font-weight:600}
.file .sz{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
#paper a.att{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:96px;margin:4px 10px 6px 0;vertical-align:top;text-align:center;text-decoration:none;color:#1F3864;font-size:8.5pt;line-height:1.2;cursor:pointer}
#paper a.att img{display:block;width:40px;height:50px}
#paper a.att span{overflow-wrap:anywhere}
.presets{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.presets .lbl{font-size:.75rem;color:var(--muted);font-weight:600;margin-right:.25rem}
.pre{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:.15rem .6rem;font-size:.75rem;color:var(--muted)}
.pre:hover{border-color:var(--accent);color:var(--accent)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;align-items:start}
.pair .x{grid-column:1/-1;display:flex;justify-content:flex-end}
.ok{color:var(--good);font-weight:600}
.bad{color:var(--crit);font-weight:600}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:.5rem}
.meter i{display:block;height:100%;background:var(--good)}
#paper{background:var(--paper);color:var(--paper-ink);font-family:Calibri,Carlito,Arial,sans-serif;font-size:10.5pt;line-height:1.35;
  max-width:816px;margin:0 auto;padding:clamp(14px,4vw,48px);box-shadow:0 1px 3px rgba(0,0,0,.25);min-height:60rem;overflow-x:auto}
#paper img{max-width:100%;height:auto;display:block}
#paper table{max-width:100%}
#paper td{word-break:break-word}
.empty-note{color:#8a94a1;font-style:italic;margin:0 0 8pt}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:.5rem .9rem;border-radius:8px;font-size:.82rem;font-weight:600;z-index:40;max-width:min(92vw,28rem);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:960px){
  .tabs{display:flex}
  .grid{grid-template-columns:minmax(0,1fr);margin-top:0}
  .grid[data-view="edit"] #previewWrap{display:none}
  .grid[data-view="preview"] #editor{display:none}
  #previewWrap{position:static;height:auto;overflow:visible;padding:.5rem}
}
@media (max-width:520px){.fields,.pair{grid-template-columns:minmax(0,1fr)}.acts .btn{flex:1}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<header class="top">
  <div class="brand"><b>Fleet Report Builder</b><span id="periodTag">Monthly report</span></div>
  <div class="acts">
    <button class="btn" id="bNew" data-act="newmonth" type="button">New month</button>
    <button class="btn" data-act="copy" type="button">Copy for Word</button>
    <button class="btn" data-act="export-html" type="button" id="bHtml">Save HTML</button>
    <button class="btn" data-act="export-zip" type="button" id="bZip" hidden title="The Word file plus a folder of plain copies of your attached files">Word + files (.zip)</button>
    <button class="btn primary" data-act="export-docx" type="button" id="bDocx">Save as Word (.docx)</button>
  </div>
</header>
<div class="tabs" role="tablist" aria-label="View">
  <button role="tab" id="tabEdit" aria-selected="true" data-view="edit" type="button">Edit</button>
  <button role="tab" id="tabPrev" aria-selected="false" data-view="preview" type="button">Report preview</button>
</div>
<main class="grid" id="grid" data-view="edit">
  <section id="editor" aria-label="Report editor"></section>
  <section id="previewWrap" aria-label="Report preview"><div id="paper"></div></section>
</main>
<datalist id="dashNames"></datalist>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var PRESETS=['Fuel Consumption','Toll Fees','Outsourced Vehicle Expenses','GPS – Driving Quality','GPS – Idling Report','Registration & Insurance','Vehicle Maintenance','Feedback Mechanism','Monthly Fuel Receipts','Driver Compliance','Trip & Dispatch','Fleet Utilization'];
var ACCOUNT_DEFAULT=['Fuel Consumption','Toll Fees','Outsourced Vehicle Expenses','GPS – Driving Quality','GPS – Idling Report','Registration & Insurance','Vehicle Maintenance','Feedback Mechanism','Monthly Fuel Receipts','Driver Compliance'];
var OBJ_DEFAULT=[
 ['People','to develop business partners and subject matter experts'],
 ['Accountability','to have functioning internal controls, compliance, accounting, monitoring and reporting'],
 ['Risk','to enhance risk management capabilities'],
 ['Technology','to automate processes'],
 ['New Ideas','to innovate and share good practices through strategic partnering'],
 ['Efficiency','to implement simple, standard, integrated processes that eliminate wastes'],
 ['ROI','to implement financial planning and develop KPIs to measure progress toward achieving country strategy']
];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function lines(t){return String(t||'').split(/\n+/).map(function(s){return s.trim()}).filter(Boolean)}
function mkItem(t){return {t:t||'',n:'',imgs:[],files:[]}}
function mkRow(n,d,items){return {n:n,d:d,u:'',items:items||[]}}
function defaultState(){
  return {
    tpl:{name:'Built-in format',info:'Based on your October 2026 Fleet Monthly Report. Upload a .docx to follow a different layout.'},
    details:[{l:'Date',v:'November 5, 2026'},{l:'Prepared by',v:'Eric A Caballes'},{l:'Submitted to',v:'Randolf Hernandez'},{l:'Report Period',v:'October 2026'}],
    sections:[
      {k:'dash',t:'Financial Highlights',items:[]},
      {k:'obj',t:'Progress Highlights',rows:OBJ_DEFAULT.map(function(o){return mkRow(o[0],o[1],/accountab/i.test(o[0])?ACCOUNT_DEFAULT.map(mkItem):[])})},
      {k:'iss',t:'Issues/Concerns and Actions Taken',rows:[{c:'',a:''}]},
      {k:'num',t:'Accomplishments',text:''}
    ]};
}
var S=defaultState(), closed={}, activeSlot=null, pendingNew=false;

/* ---------- path helpers ---------- */
function getAt(p){return p.split('.').reduce(function(o,k){return o[k]},S)}
function setAt(p,v){var a=p.split('.'),l=a.pop();a.reduce(function(o,k){return o[k]},S)[l]=v}
function parentOf(p){var a=p.split('.'),i=+a.pop();return {arr:getAt(a.join('.')),i:i}}
function removeAt(p){var r=parentOf(p);r.arr.splice(r.i,1)}
function moveAt(p,d){var r=parentOf(p),j=r.i+d;if(j<0||j>=r.arr.length)return;var t=r.arr[r.i];r.arr[r.i]=r.arr[j];r.arr[j]=t}

/* ---------- editor rendering ---------- */
function allItems(){var a=[];S.sections.forEach(function(s){if(s.k==='dash')s.items.forEach(function(i){a.push(i)});if(s.k==='obj')s.rows.forEach(function(r){r.items.forEach(function(i){a.push(i)})})});return a}
function extOf(n){var m=/\.([A-Za-z0-9]+)$/.exec(n||'');return m?m[1].toLowerCase():''}
function fmtSize(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function chipText(it){var a=[],f=(it.files||[]).length;if(it.imgs.length)a.push(it.imgs.length+(it.imgs.length>1?' images':' image'));if(f)a.push(f+(f>1?' files':' file'));return a.join(' + ')||'nothing yet'}
var iconCache={};
function iconURL(name){
  var e=extOf(name),lab=(e||'file').toUpperCase().slice(0,4);
  var col={pdf:'#D32F2F',xlsx:'#1D6F42',xls:'#1D6F42',xlsm:'#1D6F42',csv:'#1D6F42',docx:'#2B579A',doc:'#2B579A',pptx:'#C43E1C'}[e]||'#6b7785';
  var k=col+lab;if(iconCache[k])return iconCache[k];
  var c=document.createElement('canvas');c.width=80;c.height=100;var x=c.getContext&&c.getContext('2d');
  if(!x)return 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  x.beginPath();x.moveTo(6,2);x.lineTo(56,2);x.lineTo(74,20);x.lineTo(74,98);x.lineTo(6,98);x.closePath();x.fillStyle='#ffffff';x.fill();x.lineWidth=2;x.strokeStyle='#8b97a5';x.stroke();
  x.beginPath();x.moveTo(56,2);x.lineTo(56,20);x.lineTo(74,20);x.closePath();x.fillStyle='#dfe5ec';x.fill();x.stroke();
  x.fillStyle='#c5ced8';[30,40,50].forEach(function(y){x.fillRect(16,y,48,3)});
  x.fillStyle=col;x.fillRect(7,64,66,33);
  x.fillStyle='#ffffff';x.font='bold 20px Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(lab,40,81);
  return (iconCache[k]=c.toDataURL('image/png'));
}
function tplCard(){
  return '<section class="card"><h2><span class="step">1</span>Word format</h2>'+
  '<label class="drop big" id="tplDrop" data-drop-tpl="1"><input type="file" id="tplFile" accept=".docx" hidden>'+
  '<span><b>Upload your sample Word file (.docx)</b><br><span style="font-size:.8rem">The builder reads the header fields, section titles and objective rows from it.</span></span></label>'+
  '<p class="hint" id="tplMsg"><b>'+esc(S.tpl.name)+'</b> · '+esc(S.tpl.info)+'</p>'+
  (S.tpl.name!=='Built-in format'?'<p class="hint"><button class="btn sm" data-act="tpl-reset" type="button">Go back to the built-in format</button></p>':'')+
  '<p class="hint">Older .doc files: open it in Word, choose File, Save As, Word Document (.docx), then upload that copy.</p></section>';
}
function detailsCard(){
  return '<section class="card"><h2><span class="step">2</span>Report details</h2><div class="fields">'+
  S.details.map(function(d,i){return '<label class="f">'+esc(d.l)+'<input type="text" data-b="details.'+i+'.v" value="'+esc(d.v)+'"></label>'}).join('')+'</div></section>';
}
function dashHTML(path,items){
  var used={};items.forEach(function(i){used[i.t]=1});
  var h=items.map(function(it,i){
    var p=path+'.'+i;
    return '<div class="dash" data-slot="'+p+'"><div class="dash-h"><input type="text" list="dashNames" data-b="'+p+'.t" value="'+esc(it.t)+'" placeholder="Dashboard name" aria-label="Dashboard name">'+
    '<span class="chip '+((it.imgs.length||(it.files||[]).length)?'good':'')+'">'+chipText(it)+'</span>'+
    '<button class="btn sm" data-act="up" data-path="'+p+'" type="button" aria-label="Move up">↑</button>'+
    '<button class="btn sm" data-act="down" data-path="'+p+'" type="button" aria-label="Move down">↓</button>'+
    '<button class="btn sm danger" data-act="rm" data-path="'+p+'" type="button" aria-label="Remove dashboard">Remove</button></div>'+
    '<label class="drop" data-drop="'+p+'"><input type="file" accept="image/*,.pdf,.xlsx,.xls,.xlsm,.csv,.docx,.doc,.pptx,.txt" multiple hidden data-file="'+p+'"><span>Drop, click, or paste a screenshot, Excel file or PDF here</span></label>'+
    (it.imgs.length?'<div class="thumbs">'+it.imgs.map(function(im,j){var ip=p+'.imgs.'+j;
      return '<figure><img src="'+im.src+'" alt="'+esc(it.t)+' screenshot"><input type="text" data-b="'+ip+'.c" value="'+esc(im.c)+'" placeholder="Caption (optional)" aria-label="Caption">'+
      '<div class="row"><button class="btn sm" data-act="up" data-path="'+ip+'" type="button" aria-label="Move earlier">←</button><button class="btn sm" data-act="down" data-path="'+ip+'" type="button" aria-label="Move later">→</button><button class="btn sm danger" data-act="rm" data-path="'+ip+'" type="button">Remove</button></div></figure>'}).join('')+'</div>':'')+
    ((it.files||[]).length?'<div class="files">'+it.files.map(function(f,j){var fp=p+'.files.'+j;
      return '<div class="file"><img src="'+iconURL(f.name)+'" alt=""><span class="nm">'+esc(f.name)+'</span><span class="sz">'+fmtSize(f.size)+'</span><button class="btn sm danger" data-act="rm" data-path="'+fp+'" type="button" aria-label="Remove file '+esc(f.name)+'">Remove</button></div>'}).join('')+'</div>':'')+
    '<textarea rows="2" data-b="'+p+'.n" placeholder="Note under this dashboard (optional)" aria-label="Note">'+esc(it.n)+'</textarea></div>';
  }).join('');
  h+='<div class="presets"><span class="lbl">Add dashboard</span>'+PRESETS.filter(function(t){return !used[t]}).map(function(t){return '<button class="pre" data-act="add-item" data-path="'+path+'" data-t="'+esc(t)+'" type="button">+ '+esc(t)+'</button>'}).join('')+
    '<button class="pre" data-act="add-item" data-path="'+path+'" data-t="" type="button">+ Other</button></div>';
  return h;
}
function secHTML(s,si){
  var base='sections.'+si, body='';
  if(s.k==='dash'){body=dashHTML(base+'.items',s.items)}
  else if(s.k==='obj'){
    body=s.rows.map(function(r,ri){var rp=base+'.rows.'+ri;
      return '<div class="obj"><div class="obj-h"><input class="n" type="text" data-b="'+rp+'.n" value="'+esc(r.n)+'" aria-label="Objective"><input class="d" type="text" data-b="'+rp+'.d" value="'+esc(r.d)+'" placeholder="Objective description" aria-label="Objective description">'+
      '<button class="btn sm danger" data-act="rm" data-path="'+rp+'" type="button">Remove</button></div>'+
      '<label class="f">Current updates (one per line, each becomes a bullet)<textarea rows="3" data-b="'+rp+'.u">'+esc(r.u)+'</textarea></label>'+
      dashHTML(rp+'.items',r.items)+'</div>'}).join('')+
      '<div><button class="btn sm" data-act="add-row" data-path="'+base+'.rows" data-kind="obj" type="button">+ Add objective</button></div>';
  }
  else if(s.k==='iss'){
    body=s.rows.map(function(r,ri){var rp=base+'.rows.'+ri;
      return '<div class="pair"><label class="f">Concern<textarea rows="2" data-b="'+rp+'.c">'+esc(r.c)+'</textarea></label><label class="f">Actions taken<textarea rows="2" data-b="'+rp+'.a">'+esc(r.a)+'</textarea></label><div class="x"><button class="btn sm danger" data-act="rm" data-path="'+rp+'" type="button">Remove row</button></div></div>'}).join('')+
      '<div><button class="btn sm" data-act="add-row" data-path="'+base+'.rows" data-kind="iss" type="button">+ Add row</button></div>';
  }
  else {body='<label class="f">One accomplishment per line (numbered automatically)<textarea rows="7" data-b="'+base+'.text">'+esc(s.text)+'</textarea></label>'}
  var open=!closed[si];
  return '<section class="sec"><div class="sec-h"><span class="badge">'+String.fromCharCode(65+si)+'</span><input type="text" data-b="'+base+'.t" value="'+esc(s.t)+'" aria-label="Section title">'+
    '<span class="tools"><button class="btn sm" data-act="toggle" data-i="'+si+'" type="button" aria-expanded="'+open+'">'+(open?'Collapse':'Expand')+'</button>'+
    '<button class="btn sm" data-act="up" data-path="'+base+'" type="button" aria-label="Move section up">↑</button><button class="btn sm" data-act="down" data-path="'+base+'" type="button" aria-label="Move section down">↓</button>'+
    '<button class="btn sm danger" data-act="rm" data-path="'+base+'" type="button">Delete</button></span></div>'+
    (open?'<div class="sec-b">'+body+'</div>':'')+'</section>';
}
function renderEditor(){
  var items=allItems(),ready=items.filter(function(i){return i.imgs.length||(i.files||[]).length}).length;
  var pct=items.length?Math.round(ready/items.length*100):0;
  var head='<section class="card"><h2><span class="step">3</span>Dashboards and content <span class="chip '+(items.length&&ready===items.length?'good':'warn')+'">'+ready+' of '+items.length+' dashboards have a screenshot or file</span></h2>'+
    '<div class="meter" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
    '<p class="hint">Click a dashboard card, then press Ctrl+V to paste a screenshot. You can also drop Excel, PDF, CSV, Word or PowerPoint files on a card; they show in the report as a file icon. In the saved Word file, double-click the icon to open the embedded file. Dashboards with no screenshot, file or note are left out of the report.</p></section>';
  $('editor').innerHTML=tplCard()+detailsCard()+head+S.sections.map(secHTML).join('')+
    '<div><button class="btn" data-act="add-sec" type="button">+ Add section</button></div>';
  if(activeSlot){var el=$('editor').querySelector('.dash[data-slot="'+activeSlot+'"]');if(el)el.classList.add('active')}
  $('dashNames').innerHTML=PRESETS.map(function(t){return '<option value="'+esc(t)+'">'}).join('');
}

/* ---------- report (preview + export) ---------- */
var BLUE='#2F5F9E',NAVY='#1F3864',BORDER='1px solid #7f8a99';
var CELL='border:'+BORDER.replace('1px solid','1px solid')+';padding:5pt 6pt;vertical-align:top;';
function imgTag(im,w,alt){var ww=Math.min(w,im.w),hh=Math.round(ww*im.h/im.w);return '<p style="margin:0 0 3pt"><img src="'+im.src+'" width="'+ww+'" height="'+hh+'" alt="'+esc(alt)+'"></p>'+(im.c?'<p style="margin:0 0 6pt;font-size:9pt;color:#555555;font-style:italic">'+esc(im.c)+'</p>':'')}
var attMode='preview',attNames=null,pf=[];
function prepAtt(){attNames=new Map();var used={};allItems().forEach(function(it){(it.files||[]).forEach(function(f){
  var n=f.name,c=1;while(used[n.toLowerCase()]){c++;n=f.name.replace(/(\.[^.]*)?$/,' ('+c+')$1')}used[n.toLowerCase()]=1;attNames.set(f,n)})})}
function attHTML(f){
  var nm=(attNames&&attNames.get(f))||f.name,ic=iconURL(f.name);
  if(attMode==='preview'){pf.push(f);return '<a class="att" href="#" data-att="'+(pf.length-1)+'" title="Click to download '+esc(nm)+'"><img src="'+ic+'" width="40" height="50" alt=""><span>'+esc(nm)+'</span></a>'}
  var href=attMode==='html'?f.src:'Attachments/'+encodeURI(nm);
  return '<p style="margin:3pt 0 6pt"><a href="'+href+'"'+(attMode==='html'?' download="'+esc(nm)+'"':'')+' style="text-decoration:none;color:#1F3864"><img src="'+ic+'" width="34" height="42" alt="" style="vertical-align:middle"> <span style="font-size:10pt;color:#1F3864">'+esc(nm)+'</span></a></p>';

function dashReport(items,w){

        it.imgs.map(function(im){return wp(pic(im,maxPx,it.t),{af:40})+(im.c?wp(wr(im.c,{i:1,c:'555555',sz:18}),{af:120}):'')}).join('')+
        (it.files||[]).map(filePara).join('')+

  }
  var body='',lw=Math.round(W*.28);

      var a=Math.round(W*.26),rows=[[{xml:wp(wr('Objectives/Priorities',{b:1,c:'FFFFFF'})),fill:'2F5F9E'},{xml:wp(wr('Current Updates',{b:1,c:'FFFFFF'})),fill:'2F5F9E'}]];
      s.rows.forEach(function(r){
        var left=wp(wr(r.n,{b:1,sz:22}))+(r.d?wp(wr('– '+r.d,{b:1,sz:18}),{bf:40}):'');
        var right=lines(r.u).map(function(u){return wp(wr('•')+'<w:r><w:tab/></w:r>'+wr(u),{af:40,ind:360,hang:260})}).join('')+dashX(r.items,430);
        rows.push([{xml:left},{xml:right||wp('')}]);
      });
      body+=wt([a,W-a],rows);

      var rr=s.rows.filter(function(r){return r.c.trim()||r.a.trim()});if(!rr.length)rr=[{c:'',a:''}];
      var h=Math.round(W/2),rows2=[[{xml:wp(wr('Concern',{b:1,c:'FFFFFF'})),fill:'2F5F9E'},{xml:wp(wr('Actions Taken',{b:1,c:'FFFFFF'})),fill:'2F5F9E'}]];
      rr.forEach(function(r){rows2.push([{xml:wp(wr(r.c))},{xml:wp(wr(r.a))}])});
      body+=wt([h,W-h],rows2);
    }
    else{lines(s.text).forEach(function(l,i){body+=wp(wr((i+1)+'.')+'<w:r><w:tab/></w:r>'+wr(l),{af:100,ind:400,hang:400})})}
  });

function hasFiles(){return allItems().some(function(i){return (i.files||[]).length})}
function exportDocx(){
  if(!window.JSZip){toast('The Word exporter did not load. Reload the page, or use Copy for Word.');return}
  try{buildDocx().then(function(b){saveFile(fileBase()+'.docx',b);
    if(lastLinked)setTimeout(function(){toast(lastLinked+' large file'+(lastLinked>1?'s are':' is')+' linked, not embedded. Use "Word + files (.zip)" so the links work.')},3400)})
    .catch(function(){toast('Could not build the Word file. Try Copy for Word.')})}
  catch(e){toast('Could not build the Word file. Try Copy for Word.')}
}
function dataToBlob(src){var i=src.indexOf(','),mime=(/^data:([^;,]*)/.exec(src)||[])[1]||'application/octet-stream',bin=atob(src.slice(i+1)),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}
function exportZip(){
  if(!window.JSZip){toast('The zip exporter did not load. Reload the page and try again.');return}
  try{
    var base=fileBase();
    buildDocx().then(function(docx){
      var z=new JSZip();z.file(base+'.docx',docx);
      var folder=z.folder('Attachments');
      attNames.forEach(function(nm,f){folder.file(nm,dataToBlob(f.src))});
      return z.generateAsync({type:'blob'});
    }).then(function(b){saveFile(base+'.zip',b);toast('Unzip it, then open the .docx. The Attachments folder holds plain copies of your files.')})
      .catch(function(){toast('Could not build the zip file.')});
  }catch(e){toast('Could not build the zip file.')}
}
function downloadAtt(f){
  var e=extOf(f.name);
  if(!dl){browserSave(f.name,dataToBlob(f.src));return}
  if(['xls','xlsm','doc'].indexOf(e)>=0){toast('Direct download is not offered for .'+e+' files. Use "Word + files (.zip)" to get it.');return}
  dl.save({filename:f.name,data:dataToBlob(f.src)}).then(function(){toast('Saved '+f.name)}).catch(function(err){if(err&&err.code==='declined')return;toast('Could not save '+f.name+'.')});
}
function syncZip(){$('bZip').hidden=!hasFiles()}
function copyReport(){
  setView('preview');
  setTimeout(function(){
    var el=$('paper'),r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    toast(ok?'Copied. Paste into Word with Ctrl+V.':'Report selected. Press Ctrl+C, then paste into Word.');
  },60);
}
function setView(v){
  $('grid').setAttribute('data-view',v);
  $('tabEdit').setAttribute('aria-selected',String(v==='edit'));$('tabPrev').setAttribute('aria-selected',String(v==='preview'));
}

/* ---------- new month ---------- */
function newMonth(){
  S.details.forEach(function(d){if(/date|period/i.test(d.l))d.v=''});
  function clr(it){it.imgs=[];it.files=[];it.n=''}
  S.sections.forEach(function(s){
    if(s.k==='dash')s.items.forEach(clr);
    if(s.k==='obj')s.rows.forEach(function(r){r.u='';r.items.forEach(clr)});
    if(s.k==='iss')s.rows=[{c:'',a:''}];
    if(s.k==='num')s.text='';
  });
  activeSlot=null;renderEditor();changed();toast('Cleared screenshots, notes and the date. The format stays.');
}

/* ---------- events ---------- */
var ed=$('editor');
ed.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.b){setAt(t.dataset.b,t.value);changed()}});
ed.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='tplFile'){loadTemplate(t.files[0]);t.value=''}
  else if(t.dataset&&t.dataset.file){addImages(t.dataset.file,t.files);t.value=''}
});
ed.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,p=b.dataset.path;
  if(a==='toggle'){var i=+b.dataset.i;closed[i]=!closed[i];renderEditor();return}
  if(a==='up'||a==='down'){moveAt(p,a==='up'?-1:1);if(/^sections\.\d+$/.test(p))closed={};renderEditor();changed();return}
  if(a==='rm'){removeAt(p);if(/^sections\.\d+$/.test(p))closed={};if(activeSlot&&activeSlot.indexOf(p)===0)activeSlot=null;renderEditor();changed();return}
  if(a==='add-item'){var arr=getAt(p);arr.push(mkItem(b.dataset.t));activeSlot=p+'.'+(arr.length-1);renderEditor();changed();
    var el=ed.querySelector('.dash[data-slot="'+activeSlot+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(a==='add-row'){var rows=getAt(p);rows.push(b.dataset.kind==='obj'?mkRow('New objective','',[]):{c:'',a:''});renderEditor();changed();return}
  if(a==='add-sec'){S.sections.push({k:'dash',t:'New section',items:[]});renderEditor();changed();return}
  if(a==='tpl-reset'){var keep=S.details;S=defaultState();S.details=S.details.map(function(d){var o=keep.filter(function(x){return x.l===d.l})[0];return o?{l:d.l,v:o.v}:d});closed={};renderEditor();changed();return}
});
function track(e){var d=e.target.closest&&e.target.closest('.dash');if(!d)return;
  if(activeSlot!==d.dataset.slot){activeSlot=d.dataset.slot;[].forEach.call(ed.querySelectorAll('.dash.active'),function(x){x.classList.remove('active')});d.classList.add('active')}}
ed.addEventListener('focusin',track);ed.addEventListener('pointerdown',track);
ed.addEventListener('dragover',function(e){var d=e.target.closest('[data-drop],[data-drop-tpl]');if(d){e.preventDefault();d.classList.add('over')}});
ed.addEventListener('dragleave',function(e){var d=e.target.closest('[data-drop],[data-drop-tpl]');if(d)d.classList.remove('over')});
ed.addEventListener('drop',function(e){
  var d=e.target.closest('[data-drop],[data-drop-tpl]');if(!d)return;e.preventDefault();d.classList.remove('over');
  var files=e.dataTransfer&&e.dataTransfer.files;if(!files||!files.length)return;
  if(d.dataset.dropTpl)loadTemplate(files[0]);else addImages(d.dataset.drop,files);
});
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){if(!e.target.closest('[data-drop],[data-drop-tpl]'))e.preventDefault()});
document.addEventListener('paste',function(e){
  var fs=[].slice.call((e.clipboardData&&e.clipboardData.files)||[]);
  if(!fs.length)return;e.preventDefault();
  if(!activeSlot||!getAt(activeSlot)){toast('Click a dashboard card first, then paste.');return}
  addImages(activeSlot,fs);
});
document.querySelector('.acts').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='export-docx')exportDocx();
  else if(a==='export-zip')exportZip();
  else if(a==='export-html')saveFile(fileBase()+'.html',new Blob([fullDoc('html')],{type:'text/html'}));
  else if(a==='copy')copyReport();
  else if(a==='newmonth'){
    if(!pendingNew){pendingNew=true;b.textContent='Confirm: clear this month';setTimeout(function(){pendingNew=false;b.textContent='New month'},4000)}
    else{pendingNew=false;b.textContent='New month';newMonth()}
  }
});
$('paper').addEventListener('click',function(e){var a=e.target.closest('a[data-att]');if(!a)return;e.preventDefault();var f=pf[+a.dataset.att];if(f)downloadAtt(f)});
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});

/* ---------- boot ---------- */
renderEditor();renderPreview();
try{idbGet('draft').then(function(d){if(d){var s=JSON.parse(d);if(s&&s.sections&&s.details){S=s;allItems().forEach(function(i){if(!i.files)i.files=[]});renderEditor();renderPreview();syncZip();toast('Restored your last draft from this browser.')}}}).catch(function(){})}catch(e){}
try{if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){dl=d}).catch(function(){})}}catch(e){}
})();
</script>
